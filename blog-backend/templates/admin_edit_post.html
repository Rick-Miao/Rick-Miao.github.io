<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Post | Rick Miao</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='blog.css') }}"
    >
</head>

<body>

    <header>
        <nav>

            <a href="/" class="logo">
                Rick Miao
            </a>

            <div class="nav-links">

                <a href="{{ url_for('admin_dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('admin_logout') }}">
                    Logout
                </a>

            </div>

        </nav>
    </header>


    <main class="admin-dashboard">

        <p class="section-label">
            ADMIN
        </p>

        <h1>
            Edit Post
        </h1>


        {% if error %}

            <p class="login-error">
                {{ error }}
            </p>

        {% endif %}


        <form method="POST" class="post-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ post.title }}"
                required
            >


            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                name="content"
                rows="16"
                required
            >{{ post.content }}</textarea>


            <label class="checkbox-label">

                <input
                    type="checkbox"
                    name="published"
                    {% if post.published %}checked{% endif %}
                >

                Published

            </label>


            <div class="form-actions">

                <button
                    type="submit"
                    class="admin-button"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="cancel-link"
                >
                    Cancel
                </a>

            </div>

        </form>

    </main>

</body>

</html>

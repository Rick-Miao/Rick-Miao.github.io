<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Rick Miao</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='blog.css') }}"
    >
</head>

<body>

    <main class="admin-login-page">

        <section class="admin-login-card">

            <p class="section-label">
                ADMIN
            </p>

            <h1>
                Login
            </h1>

            {% if error %}
                <p class="login-error">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">
                
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Rick Miao</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='blog.css') }}"
    >
</head>

<body>

    <header>
        <nav>

            <a href="/" class="logo">
                Rick Miao
            </a>

            <div class="nav-links">

                <a href="/">
                    Blog
                </a>

                <a href="{{ url_for('admin_logout') }}">
                    Logout
                </a>

            </div>

        </nav>
    </header>


    <main class="admin-dashboard">

        <div class="admin-header">

            <div>
                <p class="section-label">
                    ADMIN
                </p>

                <h1>
                    Dashboard
                </h1>
            </div>

            <a href="{{ url_for('admin_new_post') }}" class="admin-button">
                New Post
            </a>

        </div>


        <section class="admin-posts">

            <h2>
                Posts
            </h2>


            {% if posts %}

                <div class="admin-post-list">

                    {% for post in posts %}

                        <article class="admin-post-item">

                            <div class="admin-post-info">

                                <h3>
                                    {{ post.title }}
                                </h3>

                                <p>
                                    {{ post.created_at.strftime("%B %d, %Y") }}
                                </p>

                            </div>


                            <div class="admin-post-status">

                                {% if post.published %}

                                    <span class="status published">
                                        Published
                                    </span>

                                {% else %}

                                    <span class="status draft">
                                        Draft
                                    </span>

                                {% endif %}

                            </div>


                            <div class="admin-post-actions">

                                <a href="{{ url_for('admin_edit_post', post_id = post.id) }}">
                                    Edit
                                </a>

                                <form
                                    method="POST"
                                    action="{{ url_for('admin_delete_post', post_id=post.id) }}"
                                    class="delete-form"
                                    onsubmit="return confirm('Are you sure you want to delete this post?');"
                                >
                                    <input
                                        type="hidden"
                                        name="csrf_token"
                                        value="{{ csrf_token() }}"
                                    >
                                    <button type="submit" class="delete-button">
                                        Delete
                                    </button>
                                </form>

                            </div>

                        </article>

                    {% endfor %}

                </div>

            {% else %}

                <p class="empty-message">
                    No posts yet.
                </p>

            {% endif %}

        </section>

    </main>

</body>

</html>
